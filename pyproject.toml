
[project]
name = "northmen-store"
version = "1.0.0"
description = "Sistema de gestão de vendas e estoque para uma loja de moda masculina"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "faker>=30.0.0",
    "pytest-playwright>=0.7.0",
    "playwright>=1.50.0",
    "axe-playwright-python>=0.1.6",
    "locust>=2.32.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: testes de integração da API com TestClient",
    "e2e: testes end-to-end executados no navegador com Playwright",
    "accessibility: auditorias de acessibilidade WCAG 2.1 AA com Axe-core",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv]
package = false
